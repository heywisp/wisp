id = "memory"
version = "0.1.0"
world = "0.4.0"
summary = "Saves and restores notes requested by the user"

[[tools]]
name = "remember"
provides = ["memory"]

[[prompt_sections]]
name = "list"
place = "lead"
in = ["core/state"]
after = ["workspace/environment"]
before = []

[[settings]]
name = "list_limit"
label = "Note list limit"
kind = "int"
min = 256
max = 2000
default = 2000
help = "Estimated tokens used by the saved note list in each context window."
