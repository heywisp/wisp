name: ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
defaults:
  run:
    shell: bash
jobs:
  changes:
    runs-on: &runner ubuntu-24.04
    timeout-minutes: 5
    outputs:
      safe: ${{ steps.safe.outputs.safe }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: safe
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=$(git merge-base "$BASE_SHA" HEAD)
          SAFE='^(flows/projects(/roles)?/[A-Za-z0-9._-]+\.md|docs/plans/[A-Za-z0-9._-]+\.md|research/[A-Za-z0-9._-]+\.md)$'
          if [ -n "${BASE:-}" ] && files=$(git diff --no-renames --name-only --end-of-options "$BASE" HEAD 2>/dev/null) && [ -n "$files" ] && [ "$(printf '%s\n' "$files" | grep -cvE "$SAFE")" = 0 ] \
            && modes=$(git diff --no-renames --raw --end-of-options "$BASE" HEAD 2>/dev/null) \
            && [ "$(printf '%s\n' "$modes" | grep -cvE '^:[0-7]{6} (100644|100755|000000) ')" = 0 ]; then
            echo "Every changed file is on the safe list: heavy jobs skipped."
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi
  fmt:
    runs-on: *runner
    container: &rust rust:1.99.1
    timeout-minutes: 15
    steps:
      - *checkout
      - run: cargo fmt --all --check
  clippy:
    needs: changes
    if: &heavy needs.changes.outputs.safe != 'true'
    runs-on: *runner
    container: &rust-heavy
      image: *rust
      volumes:
        - /usr/local/lib/android:/host/android
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/.ghcup:/host/ghcup
    timeout-minutes: 90
    steps:
      - &free-disk
        run: find /host/android /host/dotnet /host/ghcup -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      - *checkout
      - &cmake
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake
      - &wasm
        run: rustup target add wasm32-wasip2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p wisp-cli --no-default-features -- -D warnings
      - run: cargo clippy --target wasm32-wasip2 -p wasm-fixture -p board -- -D warnings
  test:
    needs: changes
    if: *heavy
    name: test ${{ matrix.partition }}/2
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    runs-on: *runner
    container: *rust-heavy
    timeout-minutes: 180
    env:
      NEXTEST_VERSION: "0.9.149"
      NEXTEST_SHA256: 32d1d8c0567b7a80bee2bad8bb09125c846da96bc009b2de11ec08557290c770
      NEXTEST_PROFILE: ci
    steps:
      - *free-disk
      - *checkout
      - run: |
          echo "runner $(nproc) cpus, $(awk '/MemTotal/ {printf "%d", $2 / 1048576}' /proc/meminfo) GB ram" || true
          { df -h "$GITHUB_WORKSPACE" | tail -n +2; } 2>/dev/null || true
      - run: |
          TGZ=.nextest/cargo-nextest.tar.gz
          if ! echo "${NEXTEST_SHA256}  $TGZ" | sha256sum -c --status - 2>/dev/null; then
            mkdir -p .nextest
            curl -sSfL --connect-timeout 10 --max-time 120 --retry 4 --retry-delay 5 --retry-all-errors -o "$TGZ" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz" || true
          fi
          if echo "${NEXTEST_SHA256}  $TGZ" | sha256sum -c -; then
            tar xzf "$TGZ" -C /usr/local/cargo/bin cargo-nextest
          else
            rm -f "$TGZ"
            cargo install cargo-nextest --version "$NEXTEST_VERSION" --locked --root /usr/local/cargo
          fi
      - *cmake
      - *wasm
      - run: cargo nextest run --workspace --partition hash:${{ matrix.partition }}/2
      - if: always()
        run: df -h; if [ -d target ]; then du -sh target; fi
  standalone-tests:
    needs: changes
    if: *heavy
    runs-on: *runner
    container: *rust-heavy
    timeout-minutes: 120
    steps:
      - *free-disk
      - *checkout
      - *cmake
      - *wasm
      - run: cargo fetch --locked
      - run: |
          set -euo pipefail
          GROUP_COUNT=4
          CPUS=$(nproc)
          export CARGO_BUILD_JOBS=$(( CPUS / GROUP_COUNT > 0 ? CPUS / GROUP_COUNT : 1 ))
          CHECKS=$(mktemp -d)
          echo "runner $CPUS cpus, $(awk '/MemTotal/ {printf "%d", $2 / 1048576}' /proc/meminfo) GiB ram" || true
          df -h "$GITHUB_WORKSPACE" || true
          cargo metadata -q --no-deps --format-version 1 | python3 -c 'import json,sys; print("\n".join(p["name"] for p in json.load(sys.stdin)["packages"]))' > "$CHECKS/packages"
          [ -s "$CHECKS/packages" ]
          printf '1\n' > "$CHECKS/next"
          PIDS=
          for G in $(seq 1 "$GROUP_COUNT"); do
            (
              export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/standalone-$G"
              STATUS=0
              : > "$CHECKS/checked-$G"
              exec 9> "$CHECKS/lock"
              while :; do
                flock 9
                NEXT=$(cat "$CHECKS/next")
                P=$(sed -n "${NEXT}p" "$CHECKS/packages")
                printf '%s\n' "$((NEXT + 1))" > "$CHECKS/next"
                flock -u 9
                [ -n "$P" ] || break
                echo "Checking $P (group $G)"
                printf '%s\n' "$P" >> "$CHECKS/checked-$G"
                cargo check -q -p "$P" --tests || { echo "$P tests do not type-check on their own"; STATUS=1; }
              done
              exit "$STATUS"
            ) > "$CHECKS/log-$G" 2>&1 &
            PIDS="$PIDS $!"
          done
          STATUS=0
          for PID in $PIDS; do
            wait "$PID" || STATUS=1
          done
          for G in $(seq 1 "$GROUP_COUNT"); do
            cat "$CHECKS/log-$G"
          done
          sort "$CHECKS/packages" > "$CHECKS/expected"
          sort "$CHECKS"/checked-* > "$CHECKS/actual"
          if ! diff -u "$CHECKS/expected" "$CHECKS/actual"; then
            echo "Standalone package records differ: missing or duplicate checks"
            STATUS=1
          fi
          du -sh "$GITHUB_WORKSPACE"/target/standalone-* || true
          df -h "$GITHUB_WORKSPACE" || true
          exit "$STATUS"
  ci-ok:
    if: always()
    needs: [changes, fmt, clippy, test, standalone-tests]
    runs-on: *runner
    timeout-minutes: 5
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
