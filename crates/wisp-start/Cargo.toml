[package]
name = "wisp-start"
description = "The start step shared by Wisp's programs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
futures.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
wisp-client.workspace = true
wisp-core = { workspace = true, features = ["os-keyring"] }
wisp-plugin-api.workspace = true
wisp-plugins.workspace = true
wisp-protocol.workspace = true
wisp-render.workspace = true
wisp-wasm-host = { workspace = true, optional = true }

[features]
wasm = ["dep:wisp-wasm-host"]
test-support = []

[dev-dependencies]
rustix = { workspace = true, features = ["net"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync"] }
wisp-core = { workspace = true, features = ["os-keyring", "test-support"] }
wisp-plugin-testkit.workspace = true

[lints]
workspace = true
