[providers.openai.sources]
client = "https://github.com/openai/codex/releases"
codex = "https://github.com/openai/codex/releases; the server hides models whose minimum client version exceeds the client_version sent to /codex/models; https://github.com/openai/codex/blob/rust-v0.169.0/codex-rs/models-manager/src/model_info.rs (fallback window for a model the list doesn't describe)"
subscription_tools_after_outputs = "No model is proven after tool outputs on the ChatGPT subscription; a passing run on that subscription is required; the gateway-only live_found_tool_after_openai_outputs fills no row"
api_tools_after_outputs = "No model is proven after tool outputs on the official OpenAI API; a passing run on that API is required; the gateway-only live_found_tool_after_openai_outputs fills no row"
api_additional_tools = "https://developers.openai.com/api/docs/guides/tools-tool-search; research/plugin-hot-load.md §4.2: on the official OpenAI API, gpt-6.1-sol and gpt-6-astra returned HTTP 200, called a tool declared only by additional_tools, and read 7,136 cached input tokens with the item appended, matching the unchanged-tools baseline, versus 0 with the same definition added to tools, including the original-cache-key control"
subscription_additional_tools = "https://developers.openai.com/api/docs/guides/tools-tool-search; research/plugin-hot-load.md §4.2: gpt-6.1-sol and gpt-6-astra accepted additional_tools after the user message, called its tool and a changed top-level definition, and read 7,040 cached tokens on addition and 7,168 on replay and redefinition; gpt-6.1-sol read 0 when the same tool was added to tools"
price = "https://developers.openai.com/api/docs/pricing"
cache_writes = "https://developers.openai.com/api/docs/pricing; write_30m and write_12h as added with the OpenAI connections (9b6cc6f5c), which name no page"
web_search_price = "https://developers.openai.com/api/docs/pricing#built-in-tools"
min_cacheable = "https://developers.openai.com/api/docs/guides/prompt-caching"

