[providers.anthropic.sources]
client = "https://github.com/anthropics/claude-code/releases"
weekly_limits = "https://support.claude.com/en/articles/17506494-claude-fable-5-2-launch-offers, Which models does a reset cover?; https://support.claude.com/en/articles/15424964-claude-fable-models-on-your-plan"
web_search_by_call = "Wisp: docs/endpoints.md, Web search; a fixed client function keeps the chat prefix independent of the search date"
web_search_model = "https://platform.claude.com/docs/en/about-claude/models/overview; Wisp uses the small model for search-only requests"
tools_after_results = "https://platform.claude.com/docs/en/build-with-claude/mid-conversation-system-messages; the page permits tool additions after a tool-result user message; disabled pending a successful live probe"
claude_code = "Claude Code releases: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md; compatibility profile originally observed in Manifest (research/anthropic-subscription.md)"
price = "https://platform.claude.com/docs/en/about-claude/pricing.md, with the Haiku 5.5 prompt-length rule under Long context pricing (checked 2026-11-10)"
cache_writes = "https://platform.claude.com/docs/en/about-claude/pricing.md"
web_search_price = "https://platform.claude.com/docs/en/about-claude/pricing"
min_cacheable = "https://platform.claude.com/docs/en/build-with-claude/prompt-caching.md"
inline_tools = "Mid-conversation system messages and tool changes: mid-conversation system messages on Claude Fable 5.2, Claude Fable 5.1, Claude Mythos 5.1, Claude Fable 5, Claude Mythos 5, Claude Opus 5.5, Claude Opus 5, Claude Opus 4.8, Claude Sonnet 5.5 and Claude Haiku 5.5; tool changes are in beta on the same models (beta inline-tools-2026-09-15, by value and by name, Claude API)"
deferred_tools = "Tool search tool (read 2026-11-10): both tool search variants, and so defer_loading, are available on Claude Fable 5.2, Claude Fable 5.1, Claude Mythos 5.1, Claude Fable 5, Claude Mythos 5, Claude Opus 5.5, Claude Opus 5, Claude Sonnet 5.5, Claude Sonnet 5, Claude Haiku 5.5, Claude Opus 4.8, Claude Opus 4.7, Claude Opus 4.6, Claude Sonnet 4.6, Claude Opus 4.5, Claude Sonnet 4.5 and Claude Haiku 4.5; Claude Opus 4.1 and earlier models don't support the tool search tool"
message_threads = "https://platform.claude.com/docs/en/build-with-claude/message-threads: the page's featureMetadata (betaHeader message-threads-2026-08-12) lists supportedModels in this order"
account_bound_thinking = "https://platform.claude.com/docs/en/build-with-claude/thinking#thinking-encryption: \"`signature` values are compatible across platforms, including the Claude API, Amazon Bedrock, and Claude Models on Google Cloud (Google managed). Values generated on one platform work on another, except that thinking blocks from Claude Sonnet 5.5, Claude Haiku 5.5, Claude Fable 5.2, and Claude Mythos 5.2 work only in the account that produced them or in an account linked to it\""
pages = "https://platform.claude.com/docs/en/build-with-claude/effort · https://platform.claude.com/docs/en/build-with-claude/effort#change-effort-mid-conversation-beta · https://platform.claude.com/docs/en/about-claude/models/overview · claude-api skill: SKILL.md Thinking & Effort table, shared/models.md, shared/model-migration.md · https://platform.claude.com/docs/en/build-with-claude/vision · https://platform.claude.com/docs/en/build-with-claude/context-windows · https://platform.claude.com/docs/en/build-with-claude/mid-conversation-system-messages · https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool (read 2026-11-10)"

