[package]
name = "wisp-core"
description = "Wisp.Core: the headless, LLM-agnostic agent kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-support = []
mcp-test-server = []
os-keyring = [
    "dep:keyring-core",
    "dep:zbus",
    "dep:zbus-secret-service-keyring-store",
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
]

[dependencies]
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
keyring-core = { workspace = true, optional = true }
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
opus.workspace = true
regex.workspace = true
reqwest.workspace = true
rmcp.workspace = true
rtc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shlex.workspace = true
sse-stream.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process", "io-util", "net"] }
tokio-stream.workspace = true
tokio-util.workspace = true
uuid.workspace = true
vt100.workspace = true
webrtc.workspace = true
wisp-contain.workspace = true
wisp-instructions.workspace = true
wisp-media.workspace = true
wisp-index.workspace = true
wisp-plugin-api.workspace = true
wisp-protocol.workspace = true
wisp-tool-text.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["pty"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
zbus = { workspace = true, optional = true }
zbus-secret-service-keyring-store = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
rustix = { workspace = true, features = ["net"] }
wisp-core = { workspace = true, features = ["test-support", "mcp-test-server"] }
fancy-regex.workspace = true
futures = { workspace = true, features = ["executor"] }
insta.workspace = true
image.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "rt-multi-thread", "test-util"] }
wisp-plugin-agents.workspace = true
wisp-plugin-ask-user.workspace = true
wisp-plugin-chat.workspace = true
wisp-plugin-compaction.workspace = true
wisp-plugin-context.workspace = true
wisp-plugin-idle.workspace = true
wisp-plugin-instructions.workspace = true
wisp-plugin-mcp.workspace = true
wisp-plugin-menus.workspace = true
wisp-plugin-search.workspace = true
wisp-plugin-skills.workspace = true
wisp-plugin-secret.workspace = true
wisp-plugin-self-check.workspace = true
wisp-plugin-shell.workspace = true
wisp-plugin-show-diff.workspace = true
wisp-plugin-testkit.workspace = true
wisp-plugin-time.workspace = true
wisp-plugin-todos.workspace = true
wisp-plugin-view-file.workspace = true
wisp-plugin-workspace.workspace = true
wisp-plugins.workspace = true
wit-parser.workspace = true

[[bin]]
name = "mcp-test-server"
path = "tests/support/mcp-server.rs"
required-features = ["mcp-test-server"]
test = false
bench = false
doc = false
