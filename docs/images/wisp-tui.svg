<text x="43.2" y="251.5" class="c5" textLength="352.8" lengthAdjust="spacingAndGlyphs">How do I read a file line by line in Rust?</text>
<text x="26.4" y="287.5" class="c3" textLength="8.4" lengthAdjust="spacingAndGlyphs">⠶</text>
<text x="43.2" y="287.5" class="c5" textLength="462.0" lengthAdjust="spacingAndGlyphs">Wrap the file in a BufReader and loop over its lines():</text>
<text x="43.2" y="323.5" class="c3" textLength="25.2" lengthAdjust="spacingAndGlyphs">use</text>
<text x="76.8" y="323.5" class="c5" textLength="117.6" lengthAdjust="spacingAndGlyphs">std::fs::File;</text>
<text x="816.0" y="323.5" class="c2" textLength="33.6" lengthAdjust="spacingAndGlyphs">rust</text>
<text x="43.2" y="341.5" class="c3" textLength="25.2" lengthAdjust="spacingAndGlyphs">use</text>
<text x="76.8" y="341.5" class="c5" textLength="84.0" lengthAdjust="spacingAndGlyphs">std::io::{</text>
<text x="160.8" y="341.5" class="c3" textLength="33.6" lengthAdjust="spacingAndGlyphs">self</text>
<text x="194.4" y="341.5" class="c5" textLength="184.8" lengthAdjust="spacingAndGlyphs">, BufRead, BufReader};</text>
<text x="43.2" y="377.5" class="c3" textLength="16.8" lengthAdjust="spacingAndGlyphs">fn</text>
<text x="68.4" y="377.5" class="c6" textLength="33.6" lengthAdjust="spacingAndGlyphs">main</text>
<text x="102.0" y="377.5" class="c5" textLength="84.0" lengthAdjust="spacingAndGlyphs">() -&gt; io::</text>
<text x="186.0" y="377.5" class="c7" textLength="50.4" lengthAdjust="spacingAndGlyphs">Result</text>
<text x="236.4" y="377.5" class="c5" textLength="50.4" lengthAdjust="spacingAndGlyphs">&lt;()&gt; {</text>
<text x="76.8" y="395.5" class="c3" textLength="25.2" lengthAdjust="spacingAndGlyphs">let</text>
<text x="110.4" y="395.5" class="c5" textLength="151.2" lengthAdjust="spacingAndGlyphs">file = File::open(</text>
<text x="261.6" y="395.5" class="c8" textLength="92.4" lengthAdjust="spacingAndGlyphs">"notes.txt"</text>
<text x="354.0" y="395.5" class="c5" textLength="25.2" lengthAdjust="spacingAndGlyphs">)?;</text>
<text x="76.8" y="413.5" class="c9" textLength="25.2" lengthAdjust="spacingAndGlyphs">for</text>
<text x="110.4" y="413.5" class="c5" textLength="243.6" lengthAdjust="spacingAndGlyphs">line in BufReader::new(file).</text>
<text x="354.0" y="413.5" class="c6" textLength="42.0" lengthAdjust="spacingAndGlyphs">lines</text>
<text x="396.0" y="413.5" class="c5" textLength="33.6" lengthAdjust="spacingAndGlyphs">() {</text>
<text x="110.4" y="431.5" class="c6" textLength="67.2" lengthAdjust="spacingAndGlyphs">println!</text>
<text x="177.6" y="431.5" class="c5" textLength="8.4" lengthAdjust="spacingAndGlyphs">(</text>
<text x="186.0" y="431.5" class="c8" textLength="8.4" lengthAdjust="spacingAndGlyphs">"</text>
<text x="194.4" y="431.5" class="c10" textLength="16.8" lengthAdjust="spacingAndGlyphs">{}</text>
<text x="211.2" y="431.5" class="c8" textLength="8.4" lengthAdjust="spacingAndGlyphs">"</text>
<text x="219.6" y="431.5" class="c5" textLength="75.6" lengthAdjust="spacingAndGlyphs">, line?);</text>
<text x="76.8" y="449.5" class="c5" textLength="8.4" lengthAdjust="spacingAndGlyphs">}</text>
<text x="76.8" y="467.5" class="c7" textLength="16.8" lengthAdjust="spacingAndGlyphs">Ok</text>
<text x="93.6" y="467.5" class="c5" textLength="33.6" lengthAdjust="spacingAndGlyphs">(())</text>
<text x="43.2" y="485.5" class="c5" textLength="8.4" lengthAdjust="spacingAndGlyphs">}</text>
<text x="43.2" y="521.5" class="c4" textLength="8.4" lengthAdjust="spacingAndGlyphs">∙</text>
<text x="60.0" y="521.5" class="c5" textLength="495.6" lengthAdjust="spacingAndGlyphs">BufReader reads the file in large chunks, not byte by byte.</text>
<text x="43.2" y="539.5" class="c4" textLength="8.4" lengthAdjust="spacingAndGlyphs">∙</text>
<text x="60.0" y="539.5" class="c5" textLength="512.4" lengthAdjust="spacingAndGlyphs">Each item is an io::Result&lt;String&gt;, so ? passes any error up.</text>
<text x="43.2" y="557.5" class="c4" textLength="8.4" lengthAdjust="spacingAndGlyphs">∙</text>
<text x="60.0" y="557.5" class="c5" textLength="478.8" lengthAdjust="spacingAndGlyphs">lines() strips the trailing \n (and \r\n) from each line.</text>
